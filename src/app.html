			}

				color: var(--white-1);

				font-size: 1.2em;
				border-radius: 5px;
				padding: 12px;

				margin: 0 0 10px 0;
			}

			*.button-input {

				color: var(--white-1);
				border-radius: 5px;
				padding: 12px;
				width: 100%;
			}

        width: fit-content;
      }

      *.file-input {

        background-color: var(--black-3);
        border: none;
        color: var(--white-1);
        border-radius: 5px;

<!-- This list element will be used to display the console messages -->

<!-- Style however you want -->
<style>
	#stuff {
		display: block;
		position: absolute;
		height: 50%;
		bottom: 0px;
		z-index: 100;
		overflow: scroll;
	}
  #console-output { list-style: none; color: white; }
  .console-message { border-top: 1px solid; }
</style>

<script type="module">
  // The list element used to display your messages:
  const list = document.getElementById('console-output');

  // A function to append new values to the element:
  function print (...values) {
    const listItem = document.createElement('li');
    listItem.classList.add('console-message');
    for (const value of values) {
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = JSON.stringify(value, null, 2);
      pre.appendChild(code);
      listItem.appendChild(pre);
    }
    list.appendChild(listItem);
  }
